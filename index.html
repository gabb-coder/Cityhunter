<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0B">
<meta name="description" content="City Hunter: a real-world GPS manhunt. Hunters track the pings, prey run for cover, and every catch flips a player to the other side.">
<title>City Hunter</title>
<script>
  // Apply the saved theme before first paint.
  try {
    var t = JSON.parse(localStorage.getItem('ch2.theme'));
    if (t === 'sun') {
      document.documentElement.dataset.theme = 'sun';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEEDE6');
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/catch.css">
<link rel="stylesheet" href="css/alerts.css">
<link rel="stylesheet" href="css/results.css">
</head>
<body>
<div id="app">

  <!-- 1. Home -->
  <main id="s-home" class="screen" hidden></main>

  <!-- 2. Lobby -->
  <main id="s-lobby" class="screen" hidden></main>

  <!-- 3. Role reveal + head start -->
  <main id="s-reveal" class="screen" hidden></main>

  <!-- 4 + 6. Live map (prey and hunter share one Leaflet map) -->
  <main id="s-game" class="screen screen-map" hidden>
    <div id="map" aria-label="Live map"></div>
    <div id="zone-border" aria-hidden="true" hidden></div>
    <div id="hud"></div>
    <div id="banners"></div>
    <div id="map-btns"></div>
    <div id="oz" hidden></div>
    <section id="sheet"></section>
    <section id="gps-sheet" role="alertdialog" aria-labelledby="gps-title" aria-describedby="gps-body" hidden></section>
  </main>

  <!-- 9. Results -->
  <main id="s-results" class="screen" hidden></main>

  <!-- Full-screen layers above the map -->
  <section id="s-shop" class="screen layer" aria-label="Ability shop" hidden></section>
  <section id="s-chat" class="layer chat-layer" aria-label="Chat" hidden></section>
  <section id="s-catch" class="screen layer" aria-label="Confirm catch" hidden></section>
  <section id="s-tagged" class="screen layer" aria-label="You have been tagged" hidden></section>
  <section id="s-converted" class="screen layer" aria-label="You are now a hunter" hidden></section>
  <section id="s-admin" class="screen layer" aria-label="Host console" hidden></section>

  <!-- Connection lost / host offline -->
  <div id="net" hidden></div>

  <!-- Small pickers and confirmations -->
  <div id="modal" hidden></div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="voice-audio" hidden></div>
</div>

<noscript><p style="padding:24px;font:16px system-ui">City Hunter needs JavaScript and location access to run.</p></noscript>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
